# 舞影纪 · Cloudflare Worker
name = "wyj-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# ---- 微信 AppID（公开信息）----
[vars]
WX_APPID = "wx4895e57dbf4857b7"

# ---- D1 数据库（点赞计数）----
# 部署后执行：
#   npx wrangler d1 execute wyj-likes --command="CREATE TABLE IF NOT EXISTS likes (page_id TEXT PRIMARY KEY, count INTEGER NOT NULL DEFAULT 0)"
[[d1_databases]]
binding = "DB"
database_name = "wyj-likes"
database_id = "13b847f4-6a32-46a6-b2c4-6e0444d038dc"
